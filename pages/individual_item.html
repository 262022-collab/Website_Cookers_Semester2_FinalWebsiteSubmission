<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Window — Movie Details</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/main.css">
</head>

<body class="bg-dark text-white">

<main class="artwork-bg position-relative d-flex align-items-center min-vh-100 overflow-hidden">
    
    <div class="background-overlay position-absolute top-0 start-0 w-100 h-100"></div>

    <div class="container position-relative z-1">
        <div class="row">
            <div class="col-md-8 col-lg-6">
                <h1 class="movie-title fw-bold mb-4">Movie Title</h1>
                
                <p class="mb-1 text-light">Movie description:</p>
                <p class="movie-description lead mb-4 pe-md-5">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud
                </p>
                
                <div class="d-flex align-items-center mb-4">
                    <span class="rating-number me-3 mb-0">8.6</span>
                    <div class="stars fs-4 text-light">
                        &#9733;&#9733;&#9733;&#9733;&#9733; 
                    </div>
                </div>
                
                <div class="d-flex gap-3">
                    <button class="btn btn-light text-dark rounded-pill px-4 py-2 custom-btn fw-bold">Play movie</button>
                    <button class="btn btn-outline-light rounded-pill px-4 py-2 custom-btn-outline fw-bold">Save to list</button>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/scripts.js"></script>

</body>
</html>
