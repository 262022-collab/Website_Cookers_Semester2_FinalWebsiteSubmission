<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewport" content="width-device-width, initial-scale-1.0">
        <meta name="keywords" content="template, html, css, image, paragraph, setup">
        <meta name="author" content="Declan Landman 262022">

        <title>Sign in/Sign up</title>

        <link rel="stylesheet" href="css/main.css">

    </head>
    <body>

        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<div class="container right-panel-active">


	<div class="container__form container--signup">
		<form action="#" class="form" id="form1">
			<h2 class="form__title">Sign Up</h2>
			<input type="text" placeholder="Name & Surname" class="input" />
			<input type="email" placeholder="Email" class="input" />
			<input type="password" placeholder="Password" class="input" />
			<button class="btn">Sign Up</button>
		</form>
	</div>

	<div class="container__form container--signin">
		<form action="#" class="form" id="form2">
			<h2 class="form__title">Sign In</h2>
			<input type="email" placeholder="Email" class="input" />
			<input type="password" placeholder="Password" class="input" />
			<a href="#" class="link">Forgot your password?</a>
			<button class="btn">Sign In</button>
		</form>
	</div>

<div class="container__overlay">
	<div class="overlay">
		<div class="overlay__panel overlay--left">
			<h1>Welcome Back!</h1>
			<p>Already have an account?</p>
			<button class="btn" id="signIn">Sign In</button>
		</div>
		<div class="overlay__panel overlay--right">
			<h1>Hello, Friend!</h1>
			<p>Start your journey here</p>
			<button class="btn" id="signUp">Sign Up</button>
		</div>
	</div>
</div>

<script src="js/scripts.js"></script>

</body>
</html>
