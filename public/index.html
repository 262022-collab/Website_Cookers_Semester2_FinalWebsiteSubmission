<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header class="site-header">
        <nav class="navbar navbar-expand-lg bg-black navbar-dark border-orange px-4 py-2">
            <div class="container-fluid">
                <a class="navbar-brand text-orange fw-bold fs-3" href="index.html">Website Cookers</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center gap-3 pe-3">
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="pages/library.html">Library</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="pages/favourites.html">My Favourites</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" id="authLink" href="sign_in.html">Sign In</a>
                        </li>
                    </ul>

                    <form class="d-flex gap-2" role="search">
                        <input class="form-control bg-dark-input px-3" type="search" placeholder="Search library..."
                            aria-label="Search">
                        <button class="btn bg-orange fw-bold px-4" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- HERO -->
        <section class="hero">
            <div class="hero-overlay"></div>
            <div id="heroCarousel" class="hero-media carousel slide carousel-fade" data-bs-interval="7000"
                data-bs-touch="true" data-bs-pause="false">
                <div class="carousel-inner" id="heroCarouselInner">
                    <div class="carousel-item active">
                        <img class="hero-scene" src="assets/carrie-hero.png" alt="">
                        <div class="hero-media-gradient"></div>
                    </div>
                </div>
                <div class="hero-indicators carousel-indicators" role="group" aria-label="Slide indicators">
                </div>
            </div>
            <div class="hero-controls d-flex align-items-center justify-content-between">
                <button class="hero-nav-btn" id="heroPrevious" type="button" data-bs-target="#heroCarousel"
                    data-bs-slide="prev" aria-label="Previous popular title">‹</button>
                <button class="hero-nav-btn" id="heroNext" type="button" data-bs-target="#heroCarousel"
                    data-bs-slide="next" aria-label="Next popular title">›</button>
            </div>
            <div class="container-fluid hero-content h-100 px-3 px-md-4 px-xl-5">
                <div class="row w-100 align-items-center g-0 position-relative">
                    <div class="col-12 col-lg-6 hero-copy-wrap">
                        <div class="hero-copy">
                            <h1 class="hero-title"></h1>
                            <div class="hero-badge">
                                <span id="heroBadgeText">Rating</span>
                            </div>

                            <div class="hero-actions d-flex align-items-center flex-wrap gap-3 mt-4">
                                <div class="hero-icon-wrap d-flex align-items-center gap-3 ms-lg-2">
                                    <button class="hero-circle-btn" type="button" aria-label="Add to watchlist">
                                        <span>＋</span>
                                    </button>
                                    <button class="hero-circle-btn hero-info-btn" type="button" aria-label="More info">
                                        <span>i</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- POPULAR PICKS / CAROUSEL -->
        <section class="popular-section">
            <div class="container-fluid px-3 px-md-4">
                <h2 class="section-title">Popular picks</h2>

                <div class="movie-carousel carousel slide" id="popularCarousel">
                    <button class="carousel-arrow carousel-prev" id="popularPrev" type="button"
                        data-bs-target="#popularCarousel" data-bs-slide="prev" aria-label="Previous movies">
                        ‹
                    </button>

                    <div class="carousel-inner" id="popularCarouselInner">
                        <!-- JavaScript inserts carousel slides here -->
                    </div>

                    <button class="carousel-arrow carousel-next" id="popularNext" type="button"
                        data-bs-target="#popularCarousel" data-bs-slide="next" aria-label="Next movies">
                        ›
                    </button>
                </div>
            </div>
        </section>

        <!-- TOP RATED MOVIE REVIEWS -->
        <section class="latest-reviews-section">
            <div class="container-fluid px-3 px-md-4">
                <h2 class="section-title">Top Rated Movie Reviews</h2>
                <div class="latest-reviews-list" id="latestReviewsList" role="region" aria-label="Top rated movie reviews"
                    tabindex="0">
                    <p class="latest-reviews-status" role="status">
                        Loading top rated movie reviews...
                    </p>
                </div>
            </div>
        </section>

        <!-- UPCOMING MOVIES / CAROUSEL -->
        <section class="upcoming-section">
            <div class="container-fluid px-3 px-md-4">
                <h2 class="section-title">Upcoming movies</h2>

                <div class="movie-carousel carousel slide" id="upcomingCarousel">
                    <button class="carousel-arrow carousel-prev" id="upcomingPrev" type="button"
                        data-bs-target="#upcomingCarousel" data-bs-slide="prev" aria-label="Previous upcoming movies"
                        hidden>
                        ‹
                    </button>

                    <div class="carousel-inner" id="upcomingCarouselInner">
                        <p class="upcoming-status" role="status">Loading upcoming movies...</p>
                    </div>

                    <button class="carousel-arrow carousel-next" id="upcomingNext" type="button"
                        data-bs-target="#upcomingCarousel" data-bs-slide="next" aria-label="Next upcoming movies"
                        hidden>
                        ›
                    </button>
                </div>
            </div>
        </section>        
    </main>

    <footer class="site-footer bg-black text-white text-center py-3">
        <p class="m-0 small">&copy; Declan Landman - Movie Wireframe</p>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/500fe0dc20.js" crossorigin="anonymous"></script>
    <script type="module" src="js/nav-auth.js"></script>
    <!-- (leah) PLEASE do not delete, will be added when everything is done 
     <script type="module" src="js/guard.js"></script> -->
    <script type="module" src="js/scripts.js"></script>
</body>

</html>
