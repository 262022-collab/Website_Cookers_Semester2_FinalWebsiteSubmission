<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="keywords" content="template, html, css, image, paragraph, setup">
        <meta name="author" content="Declan Landman 262022">

        <title>Sign Up/Login</title>

        <link rel="stylesheet" href="../public/css/signin.css">

    </head>
    <body>

        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<div class="container right-panel-active">


	<div class="container__form container--signup">
		<form action="#" class="form" id="signUpForm">
			<h2 class="form__title">Sign Up</h2>
			<input type="text" placeholder="Name & Surname" class="input" />
			<input type="email" id="email-input-signUp" placeholder="Email (you@example.com)" class="input" />
			<input type="password" autocomplete="new-password" id="password-input-signUp" placeholder="Password (At least 6 characters)" class="input" />
			<p id="signUpMessage"></p>
			<button class="btn">Sign Up</button>
		</form>
	</div>

	<div class="container__form container--login">
		<form action="#" class="form" id="loginForm">
			<h2 class="form__title">Login</h2>
			<input type="email" id="email-input-login" placeholder="Email" class="input" />
			<input type="password" id="password-input-login" autocomplete="current-password" placeholder="Password" class="input" />
			<p id="loginMessage"></p>
			<div class="remember-row">
				<input type="checkbox" id="remember-checkbox">
				<label for="remember-checkbox">Remember me</label>
			</div>
			<button type="button" id="forgotPasswordBtn" class="link">Forgot password?</button>
			<button class="btn">Login</button>
		</form>
	</div>

<div class="container__overlay">
	<div class="overlay">
		<div class="overlay__panel overlay--left">
			<h1>Welcome Back!</h1>
			<p>Already have an account?</p>
			<button class="btn" id="loginBtn">Login</button>
		</div>
		<div class="overlay__panel overlay--right">
			<h1>Hello, Friend!</h1>
			<p>Are you new here?</p>
			<button class="btn" id="signUpBtn">Sign Up</button>
		</div>
	</div>
</div>

<script type="module" src="js/signin.js"></script>

</body>
</html>
