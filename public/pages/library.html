<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="template, html, css, image, paragraph, setup">
    <meta name="author" content="Declan Landman 262022">

    <title>Movie Directory</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/library.css">
</head>

<body class="bg-light">

  <!-- NAVIGATION -->
     <header class="site-header">
    <nav class="navbar site-nav navbar-dark navbar-expand-lg px-4 py-2 mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">
                <img src="../assets/WebsiteCookers_Logo.png" alt="Website Cookers" height="60"> 
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 align-items-center gap-3 pe-3">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../pages/library.html">Library</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../pages/favourites.html">Favourites</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="authLink" href="../sign_in.html">Sign In</a>
                    </li>
                </ul>

                <form class="nav-search d-flex align-items-center" role="search">
                    <input class="nav-search-input" type="search" placeholder="Search..." aria-label="Search">
                    <button class="nav-search-btn" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
            </div>
        </div>
    </nav>
    </header>

    <!-- Main Content (Library Grid & Genre Filters) -->
    <main class="container mb-5">

        <!-- GENRE FILTERS -->
        <div class="genreScrollRow mb-4">
            <button
                class="genreScrollControl"
                id="genrePrev"
                type="button"
                aria-label="Scroll genres left"
                hidden>
                ‹
            </button>

            <div class="genreScroll">
                <div class="genreList" id="genreList">
                    <button class="genreBut active" data-genre="All">All</button>
                    <button class="genreBut" data-genre="Thriller">Thriller</button>
                    <button class="genreBut" data-genre="Action">Action</button>
                    <button class="genreBut" data-genre="Comedy">Comedy</button>
                    <button class="genreBut" data-genre="Romance">Romance</button>
                    <button class="genreBut" data-genre="Horror">Horror</button>
                    <button class="genreBut" data-genre="Drama">Drama</button>
                </div>
            </div>

            <button
                class="genreScrollControl"
                id="genreNext"
                type="button"
                aria-label="Scroll genres right"
                hidden>
                ›
            </button>
        </div>

        <!-- DYNAMIC MOVIE GRID -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4" id="movieGrid">
            <!-- JavaScript dynamically inserts movie cards here -->
        </div>

        <!-- SHOW MORE BUTTON wrapper -->
        <div class="showMoreWrapper mt-4">
            <button id="showMoreButton" class="showMoreButton">
                <span>Show more</span>
                
            </button>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-black text-white text-center py-3">
        <p class="m-0 small">&copy; Declan Landman - Movie Wireframe</p>
    </footer>

     <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="favToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Favourites</strong>
                <small class="text-body-secondary">just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                <span id="favToastMsg"></span>
            </div>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/500fe0dc20.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/nav-auth.js"></script>
    <!-- (Leah) Please do not delete, will be added when pages are done 
     <script type="module" src="../js/guard.js"></script> -->
    <script src="../js/library.js"></script>
</body>
</html>
