<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="template, html, css, image, paragraph, setup">
    <meta name="author" content="Declan Landman 262022">

    <title>Movie Directory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/library.css">
</head>

<body class="bg-light">

    <!-- NAVIGATION -->
    <nav class="navbar navbar-expand-lg bg-black navbar-dark border-orange px-4 py-2 mb-4">
        <div class="container-fluid">
            <a class="navbar-brand text-orange fw-bold fs-3" href="../index.html">Website Cookers</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center gap-3 pe-3">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-white" href="../pages/library.html">Library</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="../pages/favourites.html">My Favourites</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" id="authLink" href="../sign_in.html">Sign In</a>
                    </li>
                </ul>

                <form class="d-flex gap-2" role="search">
                    <input class="form-control bg-dark-input px-3" type="search" placeholder="Search library..." aria-label="Search">
                    <button class="btn bg-orange fw-bold px-4" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Content (Library Grid & Genre Filters) -->
    <main class="container mb-5">

        <!-- GENRE FILTERS -->
        <div class="genre-scroll-row mb-4">
            <button
                class="genre-scroll-control"
                id="genrePrev"
                type="button"
                aria-label="Scroll genres left"
                hidden>
                ‹
            </button>

            <div class="genre-scroll">
                <div class="genre-list" id="genreList">
                    <button class="genre-button active" data-genre="All">All</button>
                    <button class="genre-button" data-genre="Thriller">Thriller</button>
                    <button class="genre-button" data-genre="Action">Action</button>
                    <button class="genre-button" data-genre="Comedy">Comedy</button>
                    <button class="genre-button" data-genre="Romance">Romance</button>
                    <button class="genre-button" data-genre="Horror">Horror</button>
                    <button class="genre-button" data-genre="Drama">Drama</button>
                </div>
            </div>

            <button
                class="genre-scroll-control"
                id="genreNext"
                type="button"
                aria-label="Scroll genres right"
                hidden>
                ›
            </button>
        </div>

        <!-- DYNAMIC MOVIE GRID -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4" id="movieGrid">
            <!-- JavaScript dynamically inserts movie cards here -->
        </div>

        <!-- SHOW MORE BUTTON wrapper -->
        <div class="show-more-wrapper mt-4">
            <button id="showMoreButton" class="show-more-button">
                <span>Show more</span>
                <span class="chevron">⌄</span>
            </button>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-black text-white text-center py-3">
        <p class="m-0 small">&copy; Declan Landman - Movie Wireframe</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/nav-auth.js"></script>
    <!-- (Leah) Please do not delete, will be added when pages are done 
     <script type="module" src="../js/guard.js"></script> -->
    <script src="../js/library.js"></script>
</body>
</html>
