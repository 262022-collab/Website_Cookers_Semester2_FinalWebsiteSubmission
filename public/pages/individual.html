<body>

    <!-- Navigation -->
     <header class="site-header">
    <nav class="navbar site-nav navbar-dark navbar-expand-lg px-4 py-2 mb-0">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">
                <img src="../assets/WebsiteCookers_Logo.png" alt="Website Cookers" height="60"> 
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 align-items-center gap-3 pe-3">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../pages/library.html">Library</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../pages/favourites.html">Favourites</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="authLink" href="../sign_in.html">Sign In</a>
                    </li>
                </ul>

                <form class="nav-search d-flex align-items-center mx-auto mx-lg-0" id="searchForm" role="search">
                    <input class="nav-search-input" id="searchInput" type="search" placeholder="Search..." aria-label="Search">
                    <button class="nav-search-btn" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
            </div>
        </div>
    </nav>
    </header>

    <!-- Movie Details -->
    <main class="hero" id="hero">

        <div class="overlay"></div>
        <div class="container">
        <div class="movie-layout">

            <div class="movie-info">

                <h1 class="movie-title" id="movieTitle">Loading...</h1>

                <div class="movie-details" id="movieDetails"></div>
                <div class="genres" id="movieGenres"></div>

                <p class="movie-description" id="movieDescription"></p>
            </div>

            <div class="movie-actions">
                <div class="rating">
                    <span class="stars" id="stars"><i class="fa-solid fa-star"></i></span>
                    <span class="rating-number" id="ratingNumber"></span>
                </div>

                <div class="buttons">
                    <button class="btn-play" type="button"><i class="fa-solid fa-play"></i>Play movie</button>
                    <button class="btn-save" id="saveBtn" type="button">Add to Favourites</button>
                </div>
            </div>

            </div>
        </div>
    </main>

    <div class="container movie-extras">

        <section id="castSection">
            <h2 class="section-title">Cast</h2>
            <div class="cast-list" id="castList"></div>
        </section>

        <section id="watchSection">
            <h2 class="section-title">Where to watch in South Africa</h2>
            <div class="provider-groups" id="providerGroups"></div>
            <p class="provider-note">Streaming data provided by JustWatch</p>
        </section>

        <section id="similarSection">
            <h2 class="section-title">Similar movies</h2>
            <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4" id="similarList"></div>
        </section>
    </div>

    <!-- TOAST -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="favToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header">
                    <strong class="me-auto">Favourites</strong>
                    <small class="text-body-secondary">just now</small>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body">
                    <span id="favToastMsg"></span>
                </div>
            </div>
        </div>

    <!-- Footer -->

                </nav>

                    <a href="https://www.facebook.com/theopenwindow" aria-label="Facebook" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://x.com/open_window_" aria-label="Twitter" target="_blank"><i class="fa-brands fa-twitter"></i></a>
                    <a href="https://www.instagram.com/openwindow_sl_stb/" aria-label="Instagram" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
        </div>

        <div class="footer-row">
            <a href="#">Terms & Conditions</a>

        </div>
