<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website cookers</title>
    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/main.css">
</head>

<body>



    

<!--NAVIGATION-->
<header class="site-header">

 <nav class="navbar navbar-expand-lg bg-black navbar-dark border-orange px-4 py-2 mb-4">
            <div class="container-fluid">
                
                <a class="navbar-brand text-orange fw-bold fs-3" href="#">Website Cookers</a>

                <!--switch to phone mode/smaller screen-->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center gap-3 pe-3">
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">Library</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">My Collection</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">Sign In</a>
                        </li>
                    </ul>

                   
                    <form class="d-flex gap-2" role="search">
                        <input class="form-control bg-dark-input px-3" type="search" placeholder="Search library..." aria-label="Search">
                        <button class="btn bg-orange fw-bold px-4" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>


</header>

<main>

    <!--HERO-->
    <section class="hero">
        <div class="container-fluid hero-content h-100 d-flex align-items-center px-4 px-md-5">
            <div class="hero-copy">
                <h1>Welcome</h1>

                <p>
                    Welcome to website cookers
                </p>

                <button class="btn browse-button">
                    Browse
                </button>
            </div>
        </div>
    </section>


    <!--POPULAR PICKS / CAROUSEL-->
    <section class="popular-section">

        <div class="container-fluid px-3 px-md-4">

            <h2 class="section-title">Popular picks</h2>

            <div class="movie-carousel carousel slide" id="popularCarousel" data-bs-ride="carousel">

                <button
                    class="carousel-arrow carousel-prev"
                    id="popularPrev"
                    type="button"
                    data-bs-target="#popularCarousel"
                    data-bs-slide="prev"
                    aria-label="Previous movies">
                    ‹
                </button>

                <div class="carousel-inner" id="popularCarouselInner">
                    <!-- JavaScript inserts slides here -->
                </div>

                <button
                    class="carousel-arrow carousel-next"
                    id="popularNext"
                    type="button"
                    data-bs-target="#popularCarousel"
                    data-bs-slide="next"
                    aria-label="Next movies">
                    ›
                </button>

            </div>


            <!--GENRE FILTERS-->
            <div class="genre-scroll-row">
                <button
                    class="genre-scroll-control"
                    id="genrePrev"
                    type="button"
                    aria-label="Scroll genres left"
                    hidden>
                    ‹
                </button>

                <div class="genre-scroll">
                <div class="genre-list" id="genreList">

                    <button class="genre-button active" data-genre="All">
                        All
                    </button>

                    <button class="genre-button" data-genre="Thriller">
                        Thriller
                    </button>

                    <button class="genre-button" data-genre="Action">
                        Action
                    </button>

                    <button class="genre-button" data-genre="Comedy">
                        Comedy
                    </button>

                    <button class="genre-button" data-genre="Romance">
                        Romance
                    </button>

                    <button class="genre-button" data-genre="Horror">
                        Horror
                    </button>

                    <button class="genre-button" data-genre="Drama">
                        Drama
                    </button>

                </div>
                </div>

                <button
                    class="genre-scroll-control"
                    id="genreNext"
                    type="button"
                    aria-label="Scroll genres right"
                    hidden>
                    ›
                </button>
            </div>


            <!--MOVIE GRID-->
            <section class="movie-grid" id="movieGrid">
                <!-- JavaScript inserts movies here -->
            </section>


            <div class="show-more-wrapper">
                <button id="showMoreButton" class="show-more-button">
                    <span>Show more</span>
                    <span class="chevron">⌄</span>
                </button>
            </div>

        </div>
    </section>

</main>


<!--FOOTER-->
<footer class="site-footer">

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/scripts.js"></script>

</body>
</html>
